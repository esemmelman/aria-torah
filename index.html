<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3ead6">
  <title>Exodus 14:15–30 · Chant the Verses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">שְׁמוֹת · EXODUS</p>
      <h1>Chapter 14, verses 15–30</h1>

      <div class="display-controls" aria-label="Text display options">
        <button class="display-toggle" id="trope-toggle" type="button" aria-pressed="false">Trope</button>
        <button class="display-toggle" id="script-toggle" type="button" aria-pressed="false">Script</button>
      </div>
    </header>

    <section class="passage-card" id="passage" aria-label="Exodus chapter 14, verses 15 through 30"></section>

    <p class="status" id="status" aria-live="polite">Hover to hear a group, select ● to re-record it, or select a verse number to play the whole verse.</p>
    <p class="audio-credit">Group recordings saved with Supabase</p>
    <p class="version">Version 1.5.4</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
